services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      CALMSPACE_ENV: production
      DATABASE_URL: sqlite:////data/calmspace.db
      CALMSPACE_SESSION_TTL_DAYS: ${CALMSPACE_SESSION_TTL_DAYS:-90}
      CALMSPACE_SESSION_PEPPER: ${CALMSPACE_SESSION_PEPPER:?Set CALMSPACE_SESSION_PEPPER (>=16 chars) before starting production container}
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      CALMSPACE_AI_PROVIDER: ${CALMSPACE_AI_PROVIDER:-mock}
      CALMSPACE_AI_MODEL: ${CALMSPACE_AI_MODEL:-gemini-1.5-flash}
      CALMSPACE_AI_API_KEY: ${CALMSPACE_AI_API_KEY:-}
      CALMSPACE_AI_ENABLED: ${CALMSPACE_AI_ENABLED:-true}
      CALMSPACE_AI_ALLOW_LOCAL_RATE_LIMITER: "true"
    volumes:
      - calmspace_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  calmspace_data:
